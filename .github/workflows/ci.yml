name: CI

on:
  pull_request:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      base:
        description: Ancestor commit for a scoped run. Leave empty to run the full suite.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      desktop: ${{ steps.scope.outputs.desktop }}
      go: ${{ steps.scope.outputs.go }}
      web: ${{ steps.scope.outputs.web }}
      ios: ${{ steps.scope.outputs.ios }}
      workflow: ${{ steps.scope.outputs.workflow }}
      notes: ${{ steps.scope.outputs.notes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test the CI path rules
        run: python3 -B .github/scripts/test_ci_scope.py
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || inputs.base }}
        run: python3 -B .github/scripts/ci_scope.py --base "$BASE"

  # What to Test comes from ios/WhatToTest.md, a bullet per locale, through
  # ios/scripts/test-notes: a pull request that changes what a tester sees
  # adds one, and one that reads like a commit subject fails. It runs on
  # pull requests that affect the app or its notes.
  what-to-test:
    needs: changes
    if: github.event_name == 'pull_request' && (needs.changes.outputs.ios == 'true' || needs.changes.outputs.notes == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: ios/WhatToTest.md
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        # The script that judges the pull request comes from the base commit,
        # so the pull request cannot edit its own check. It reads the merge
        # commit (HEAD here) by SHA: the objects are shared.
        run: |
          TO=$(git rev-parse HEAD)
          git worktree add "$RUNNER_TEMP/base" "$BASE"
          "$RUNNER_TEMP/base/ios/scripts/test-notes" check "$BASE" "$TO"

  # gofmt and vet, and each system's code cross-compiled. It runs on the
  # large box (8 vCPU, 16 GiB), as vet and lint compile everything.
  build:
    needs: changes
    if: needs.changes.outputs.desktop == 'true' || needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@v6
        id: cache
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ hashFiles('go.sum') }}-
            go-build-
      - name: gofmt
        shell: bash
        run: |
          unformatted=$(git ls-files -z '*.go' | xargs -0 -r gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"
            echo "$unformatted"
            exit 1
          fi
      # Each system's files and tests: build skips the tests, and they run
      # on Linux only.
      - name: vet
        env:
          CGO_ENABLED: "0"
        run: |
          for os in linux windows darwin; do
            echo "::group::$os"
            GOOS=$os go vet ./...
            echo "::endgroup::"
          done
      - name: lint
        env:
          CGO_ENABLED: "0"
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...
      - name: build
        env:
          CGO_ENABLED: "0"
        run: |
          for t in linux/amd64 linux/arm64 windows/amd64 darwin/arm64; do
            echo "::group::$t"
            GOOS=${t%/*} GOARCH=${t#*/} go build ./...
            echo "::endgroup::"
          done
      - uses: actions/cache/save@v6
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.cache.outputs.cache-primary-key }}

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/web-build
        with:
          check: 'true'

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    uses: ./.github/workflows/ios-test.yml

  workflow:
    needs: changes
    if: needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Check workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -ignore 'label "xcode-27" is unknown'
      - name: Check TestFlight script syntax
        run: |
          for script in ios/scripts/{asc-env,test-notes,testflight,upload}; do
            bash -n "$script"
          done

  # Three root shards cover the desktop and CLI. Shared Go changes also
  # run the non-root packages under the race detector.
  test-linux:
    needs: changes
    if: needs.changes.outputs.desktop == 'true' || needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    # One run of a part that hangs, at 15 minutes, and the setup.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.changes.outputs.go == 'true' && '["root-0","root-1","root-2","others"]' || '["root-0","root-1","root-2"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      # Its own cache, as build's holds no compiled tests.
      - uses: actions/cache/restore@v6
        id: cache
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-test-linux-${{ startsWith(matrix.part, 'root') && 'root' || 'others' }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-test-linux-${{ startsWith(matrix.part, 'root') && 'root' || 'others' }}-${{ hashFiles('go.sum') }}-
            go-test-linux-${{ startsWith(matrix.part, 'root') && 'root' || 'others' }}-
      - name: test
        shell: bash
        env:
          PART: ${{ matrix.part }}
          # The number of root-N parts in the matrix.
          ROOT_PARTS: 3
        # No part retries: a failed test fails the job.
        run: |
          if [ "$PART" = others ]; then
            package_list=$(go list ./... | grep -vx 'gorex')
            mapfile -t packages <<< "$package_list"
            go test -race "${packages[@]}" -count=1 -timeout 15m
          else
            go test -c -o "$RUNNER_TEMP/gorex.test" .
            tests=$("$RUNNER_TEMP/gorex.test" -test.list '^(Test|Example|Fuzz)' |
              awk -v n="$ROOT_PARTS" -v i="${PART#root-}" 'NR % n == i' | paste -sd'|' -)
            [ -n "$tests" ]
            "$RUNNER_TEMP/gorex.test" -test.timeout 15m -test.run "^($tests)\$"
          fi
      # root-0, root-1 and root-2 share one key, so root-0 saves for them.
      - uses: actions/cache/save@v6
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true' && (matrix.part == 'root-0' || matrix.part == 'others')
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.cache.outputs.cache-primary-key }}

  test-windows:
    needs: changes
    if: needs.changes.outputs.go == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      # Root UI integration tests take ~40m and hit Session 0 timing flakes on
      # yibo-pc, so CI runs all subpackages here (~3.5m) which cover ConPTY,
      # session server, CLI, rexapi, and Windows-specific subsystems.
      - name: test
        shell: powershell
        env:
          CGO_ENABLED: "0"
        run: |
          $pkgs = go list ./... | Where-Object { $_ -ne 'gorex' }
          go test $pkgs -count=1 -timeout 15m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  result:
    name: CI result
    needs: [changes, what-to-test, build, web, ios, workflow, test-linux, test-windows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: test "$FAILED" = false
