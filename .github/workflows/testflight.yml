name: TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: windrex-testflight
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  upload:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.WINDREX_TESTFLIGHT_RUNNER || 'xcode-27' }}
    steps:
      # The history, for What to Test.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The app icon uses features introduced in Icon Composer 2 (Xcode 27).
      - run: xcodebuild -version
      - run: for t in asc xcodegen; do command -v "$t" >/dev/null || brew install "$t"; done
      # ios/project.yml's minimumXcodeGenVersion: the Icon Composer icons
      # (.icon folders) need 2.45.1; an older xcodegen the Mac kept upgrades.
      - run: |
          v=$(xcodegen --version | grep -Eo '[0-9]+(\.[0-9]+)+' | head -1)
          [[ $(printf '%s\n' 2.45.1 "$v" | sort -V | head -1) == 2.45.1 ]] || brew upgrade xcodegen
      # The script pins Ghostty's commit and Zig's version.
      - uses: actions/cache/restore@v6
        id: ghostty-vt
        with:
          path: ios/Frameworks/GhosttyVt.xcframework
          key: ghostty-vt-${{ hashFiles('ios/scripts/build-ghostty-vt.sh') }}
      - if: steps.ghostty-vt.outputs.cache-hit != 'true'
        run: ios/scripts/build-ghostty-vt.sh
      - if: steps.ghostty-vt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ios/Frameworks/GhosttyVt.xcframework
          key: ${{ steps.ghostty-vt.outputs.cache-primary-key }}
      # Built-in Tailscale (ios/tailnet), with the Go and gomobile go.mod pins.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # The runner keeps Go's caches between runs; a saved copy took
          # 7 GB of the repository's 10 GB Actions cache.
          cache: false
      - uses: actions/cache/restore@v6
        id: tailnet
        with:
          path: ios/Frameworks/Tailnet.xcframework
          key: tailnet-${{ hashFiles('go.mod', 'go.sum', 'ios/tailnet/**', 'internal/tailnode/**', 'ios/scripts/build-tailnet') }}
      - if: steps.tailnet.outputs.cache-hit != 'true'
        run: ios/scripts/build-tailnet
      - if: steps.tailnet.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ios/Frameworks/Tailnet.xcframework
          key: ${{ steps.tailnet.outputs.cache-primary-key }}
      - name: upload
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          WINDREX_ASC_APP_ID: ${{ vars.WINDREX_ASC_APP_ID }}
          WINDREX_APPLE_TEAM_ID: ${{ vars.WINDREX_APPLE_TEAM_ID }}
          WINDREX_PUSH_RELAY_URL: ${{ vars.WINDREX_PUSH_RELAY_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ -n $ASC_KEY_P8 ]] || { echo "::error::The ASC_KEY_P8 secret is empty: set it to the App Store Connect API key (.p8)"; exit 1; }
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          (umask 077; printf '%s\n' "$ASC_KEY_P8" > "$ASC_KEY_PATH")
          ios/scripts/upload | tee "$RUNNER_TEMP/upload.log"
          sed -n 's/^UPLOADED /Uploaded WindRex /p' "$RUNNER_TEMP/upload.log" >> "$GITHUB_STEP_SUMMARY"
          # What to Test: what ios/WhatToTest.md gained since the last run
          # that uploaded. Notes that fail leave the upload as it is.
          read -r V B < <(sed -n 's/^UPLOADED \([0-9.]*\) (\([0-9]*\))$/\1 \2/p' "$RUNNER_TEMP/upload.log") || true
          FROM=$(gh run list -R "$GITHUB_REPOSITORY" --workflow testflight.yml --branch main --status success -L 1 --json headSha -q '.[0].headSha' || true)
          ios/scripts/test-notes "${V:-}" "${B:-}" "${FROM:-HEAD~1}" || echo "::warning::What to Test was not set for ${V:-?} (${B:-?})"
      - if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-logs
          path: ios/build/*.log
          if-no-files-found: ignore
